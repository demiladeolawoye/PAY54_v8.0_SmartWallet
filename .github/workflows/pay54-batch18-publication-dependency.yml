name: PAY54 Batch 18 Publication Dependency Security

on:
  pull_request:
    branches:
      - cto/batch17-balance-visibility-568-617
      - project-titan
    paths:
      - "backend/governance/pay54-firstparty-html-dependency-audit.mjs"
      - "backend/governance/pay54-batch18-*.mjs"
      - "backend/tests/account-batch18-*.test.mjs"
      - ".github/workflows/pay54-batch18-publication-dependency.yml"
      - "docs/engineering/pay54-batch18-*.md"
      - "dashboard.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-batch18-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-security:
    name: restricted-output-source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PAY54_ENV: test
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Syntax validation
        run: |
          node --check backend/governance/pay54-firstparty-html-dependency-audit.mjs
          for file in backend/governance/pay54-batch18-*.mjs backend/tests/account-batch18-*.test.mjs; do
            if test -f "$file"; then node --check "$file"; fi
          done
      - name: Execute fail-closed source and release regression tests
        run: node --test backend/tests/account-batch18-*.test.mjs
      - name: Verify no financial or cloud authority granted
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          echo "No Pages upload, deployment, provisioning, or financial operation."
