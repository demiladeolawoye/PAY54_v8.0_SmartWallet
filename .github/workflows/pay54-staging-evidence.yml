
name: PAY54 Staging Evidence Register Audit

on:
  push:
    branches:
      - project-titan
    paths:
      - "backend/governance/staging-evidence-register.json"
      - "backend/governance/staging-evidence-audit.mjs"
      - "backend/tests/staging-evidence-register.test.mjs"
      - ".github/workflows/pay54-staging-evidence.yml"

  pull_request:
    paths:
      - "backend/governance/staging-evidence-register.json"
      - "backend/governance/staging-evidence-audit.mjs"
      - "backend/tests/staging-evidence-register.test.mjs"
      - ".github/workflows/pay54-staging-evidence.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-staging-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-audit:
    name: PAY54 Read-only Evidence Register Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout PAY54 source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run evidence register regression tests
        run: node --test backend/tests/staging-evidence-register.test.mjs

      - name: Publish read-only evidence audit
        run: node backend/governance/staging-evidence-audit.mjs
