name: PAY54 Batch52 Integrated Source Admission (NO DEPLOY)
on:
  pull_request:
    branches: [project-titan]
    paths:
      - "backend/tests/batch52-integrated-source-admission.test.mjs"
      - "docs/engineering/PAY54-BATCH52-permanent-integrated-candidate.md"
      - ".github/workflows/pay54-batch52-integrated-source.yml"
      - ".github/workflows/pay54-batch22-postgres-rls-integration.yml"
permissions:
  contents: read
jobs:
  integrated-source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify integrated financial security and regression files
        run: |
          node --check backend/tests/batch52-integrated-source-admission.test.mjs
          node --test backend/tests/batch52-integrated-source-admission.test.mjs
