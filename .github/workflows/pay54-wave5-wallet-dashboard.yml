name: PAY54 Wave5 Wallet Dashboard & Canonical Writer Boundary
on:
  pull_request:
    branches:
      - cto/acceleration-wave4-wallet-http-integration-20261126
      - project-titan
    paths:
      - "backend/src/wave2/wallet-dashboard-controller.mjs"
      - "backend/tests/pay54-wave5-wallet-dashboard.test.mjs"
      - "backend/db/tests/batch58/*.sql"
      - "docs/engineering/PAY54-ACCELERATION-WAVE5.md"
      - ".github/workflows/pay54-wave5-wallet-dashboard.yml"
      - ".github/workflows/pay54-batch22-postgres-rls-integration.yml"
permissions:
  contents: read
jobs:
  wallet-dashboard-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify wallet dashboard remains immutable and transfer-disabled
        run: |
          node --check backend/src/wave2/wallet-dashboard-controller.mjs
          node --test backend/tests/pay54-wave5-wallet-dashboard.test.mjs backend/tests/pay54-wave4-http-wallet-integration.test.mjs
