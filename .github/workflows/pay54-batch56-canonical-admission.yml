name: PAY54 Batch56 Canonical Financial Writer Admission (OFFLINE)
on:
  pull_request:
    branches:
      - cto/batch55-physical-ledger-revocation-races-20261125
      - project-titan
    paths:
      - "backend/governance/pay54-canonical-financial-writer-admission.mjs"
      - "backend/tests/pay54-canonical-financial-writer-admission.test.mjs"
      - "backend/db/tests/batch56/*.sql"
      - "docs/engineering/PAY54-BATCH56-canonical-financial-writer-admission.md"
      - ".github/workflows/pay54-batch56-canonical-admission.yml"
      - ".github/workflows/pay54-batch22-postgres-rls-integration.yml"
permissions:
  contents: read
jobs:
  source-only-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify strictly no-go canonical financial admission contract
        run: |
          node --check backend/governance/pay54-canonical-financial-writer-admission.mjs
          node --test backend/tests/pay54-canonical-financial-writer-admission.test.mjs
