name: PAY54 Batch 07 Account Security Integration

on:
  push:
    branches: [project-titan]
    paths:
      - "backend/db/tests/015_account_rls_cross_tenant.sql"
      - "backend/db/account-*.mjs"
      - "backend/domain/account-*.mjs"
      - "backend/http/account-*.mjs"
      - "backend/security/account-*.mjs"
      - "backend/governance/account-*.mjs"
      - "backend/tests/account-*.test.mjs"
      - ".github/workflows/pay54-account-batch07-integration.yml"
  pull_request:
    paths:
      - "backend/db/tests/015_account_rls_cross_tenant.sql"
      - "backend/db/account-*.mjs"
      - "backend/domain/account-*.mjs"
      - "backend/http/account-*.mjs"
      - "backend/security/account-*.mjs"
      - "backend/governance/account-*.mjs"
      - "backend/tests/account-*.test.mjs"
      - ".github/workflows/pay54-account-batch07-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-batch07-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pay54_batch07_ci
          POSTGRES_PASSWORD: pay54_disposable_batch07_ci_2026
          POSTGRES_DB: pay54_batch07_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pay54_batch07_ci -d pay54_batch07_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: pay54_batch07_ci
      PGPASSWORD: pay54_disposable_batch07_ci_2026
      PGDATABASE: pay54_batch07_test
      PGSSLMODE: disable
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install disposable PostgreSQL testing client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply unchanged migrations 001–013 in ephemeral PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/db/migrations/{001,002,003,004,005,006,007,008,009,010,011,012,013}_*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify cross-tenant RLS and financial isolation
        shell: bash
        run: |
          set -euo pipefail
          for suite in 015 014 013 012 011 010 009 008 007; do
            for file in backend/db/tests/${suite}_*.sql; do
              psql -X -v ON_ERROR_STOP=1 -f "$file"
            done
          done
      - name: Validate account source controls
        run: |
          node backend/governance/account-rls-audit.mjs
          node backend/governance/account-auth-security.mjs
          node backend/governance/account-source-security.mjs
          node backend/governance/account-batch07-safety.mjs
      - name: Verify JavaScript syntax and account regression suite
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/db/account-*.mjs backend/domain/account-*.mjs backend/http/account-*.mjs backend/security/account-*.mjs backend/governance/account-*.mjs; do
            node --check "$file"
          done
          node --test backend/tests/account-*.test.mjs backend/tests/trusted-account-principal.test.mjs
      - name: Confirm cloud and money execution disabled
        run: |
          test "$TF_VAR_authorized_provisioning" = "false"
          test "$PAY54_REAL_MONEY_MODE" = "false"
          echo "Source and disposable CI only; no live PostgreSQL, financial execution or cloud provisioning."
