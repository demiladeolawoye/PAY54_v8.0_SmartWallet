
name: PAY54 Capture Release Concurrency

on:
  push:
    branches:
      - project-titan
    paths:
      - "backend/db/**"
      - ".github/workflows/pay54-capture-release-concurrency.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-capture-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-release-concurrency:
    name: Concurrent Financial Lifecycle Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pay54_race_ci
          POSTGRES_PASSWORD: pay54_disposable_race_ci_2026
          POSTGRES_DB: pay54_race_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pay54_race_ci -d pay54_race_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: pay54_race_ci
      PGPASSWORD: pay54_disposable_race_ci_2026
      PGDATABASE: pay54_race_test
      PGSSLMODE: disable
      PGCONNECT_TIMEOUT: "10"

    steps:
      - name: Checkout PAY54 source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check Bash test syntax
        run: |
          bash -n backend/db/tests/007_capture_release_concurrency.sh

      - name: Verify isolated PostgreSQL connection
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -c "SELECT current_database(), current_user, version();"

      - name: Apply financial migrations 001 through 006
        run: |
          for migration in \
            backend/db/migrations/001_financial_ledger.sql \
            backend/db/migrations/002_ledger_integrity_hardening.sql \
            backend/db/migrations/003_wallet_reservation.sql \
            backend/db/migrations/004_reservation_lifecycle.sql \
            backend/db/migrations/005_operation_state_integrity.sql \
            backend/db/migrations/006_database_role_isolation.sql
          do
            echo "Applying ${migration}"
            psql -X -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Execute concurrent capture and release tests
        run: |
          bash backend/db/tests/007_capture_release_concurrency.sh

      - name: Verify financial execution remains inaccessible
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_enabled BOOLEAN;
            v_mode TEXT;
          BEGIN
            SELECT execution_enabled, execution_mode
            INTO v_enabled, v_mode
            FROM pay54.financial_execution_status();

            IF v_enabled IS DISTINCT FROM FALSE
               OR v_mode <>
                  'DISABLED_PENDING_TRUSTED_EXECUTION'
            THEN
              RAISE EXCEPTION
                'Financial execution was unexpectedly enabled';
            END IF;

            RAISE NOTICE
              'PASS: Trusted financial execution remains disabled';
          END;
          $$;
          SQL

      - name: Report concurrency acceptance checkpoint
        run: |
          echo "PAY54 migrations 001-006 applied."
          echo "Capture versus release race tested."
          echo "Duplicate capture and release races tested."
          echo "Final balances and outbox events checked."
          echo "Production financial execution remains disabled."
