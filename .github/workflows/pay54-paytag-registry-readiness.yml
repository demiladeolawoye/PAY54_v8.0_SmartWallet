name: PAY54 PayTag Registry Readiness Source Tests

on:
  pull_request:
    branches:
      - cto/cr-paytag01-source-contract-20261119
      - project-titan
    paths:
      - "backend/domain/paytag-identity-contract.mjs"
      - "backend/domain/paytag-registry-readiness.mjs"
      - "backend/tests/paytag-identity-contract.test.mjs"
      - "backend/tests/paytag-registry-readiness.test.mjs"
      - "docs/architecture/CR-PAYTAG-01-registry-readiness-gates.md"
      - ".github/workflows/pay54-paytag-registry-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-paytag-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paytag-readiness:
    name: validate-source-only-paytag-registry-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_ENV: test
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Validate source syntax
        run: |
          node --check backend/domain/paytag-identity-contract.mjs
          node --check backend/domain/paytag-registry-readiness.mjs
          node --check backend/tests/paytag-registry-readiness.test.mjs
      - name: Run source-only security and identity regressions
        run: |
          node --test backend/tests/paytag-identity-contract.test.mjs backend/tests/paytag-registry-readiness.test.mjs backend/tests/account-wallet-eligibility.test.mjs
      - name: Validate release authority remains disabled
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          node --input-type=module -e '
            import {PAY54_PAYTAG_REGISTRY_READINESS as p} from "./backend/domain/paytag-registry-readiness.mjs";
            if(p.registryWriteAuthorised !== false || p.recipientResolutionAuthorised !== false ||
               p.financialExecutionEnabled !== false || p.productionRelease !== "BLOCKED") process.exit(1);
          '
