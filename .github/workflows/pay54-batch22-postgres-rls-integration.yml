          test "${PAY54_FINANCIAL_EXECUTION}" = "false"
          test -n "${POSTGRES_CONTAINER}"
          docker exec -i "${POSTGRES_CONTAINER}" psql -U postgres -d pay54_disposable_ci \
            -X -v ON_ERROR_STOP=1 < backend/db/tests/batch53/001_restricted_writer_canary_disposable.sql
