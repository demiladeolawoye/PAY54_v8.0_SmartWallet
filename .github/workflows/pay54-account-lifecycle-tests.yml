name: PAY54 Wallet Ownership Lifecycle Tests

on:
  push:
    branches: [project-titan]
    paths:
      - "backend/db/migrations/010_wallet_binding_lifecycle_guard.sql"
      - "backend/db/tests/010_wallet_binding_lifecycle_guard.sql"
      - ".github/workflows/pay54-account-lifecycle-tests.yml"
  pull_request:
    paths:
      - "backend/db/migrations/010_wallet_binding_lifecycle_guard.sql"
      - "backend/db/tests/010_wallet_binding_lifecycle_guard.sql"
      - ".github/workflows/pay54-account-lifecycle-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-account-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pay54_lifecycle_ci
          POSTGRES_PASSWORD: pay54_disposable_lifecycle_ci_2026
          POSTGRES_DB: pay54_lifecycle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pay54_lifecycle_ci -d pay54_lifecycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: pay54_lifecycle_ci
      PGPASSWORD: pay54_disposable_lifecycle_ci_2026
      PGDATABASE: pay54_lifecycle_test
      PGSSLMODE: disable
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations 001–010 to disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for migration in backend/db/migrations/{001,002,003,004,005,006,007,008,009,010}_*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Test bound-wallet owner and membership revocation
        run: psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/010_wallet_binding_lifecycle_guard.sql
      - name: Recheck account binding and ledger isolation
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/009_personal_wallet_binding.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/007_direct_ledger_access_boundary.sql
      - name: Confirm safety gates
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
