name: PAY54 Batch 13 Static Publication Link Audit

on:
  pull_request:
    branches: [project-titan]
    paths:
      - "*.html"
      - "assets/**"
      - "backend/governance/pay54-static-site-link-audit.mjs"
      - "backend/governance/pay54-css-asset-link-audit.mjs"
      - "backend/governance/pay54-publication-source-readiness.mjs"
      - "backend/governance/pay54-static-site-content-integrity.mjs"
      - "backend/governance/pay54-static-site-stage-builder.mjs"
      - "backend/governance/pay54-static-site-stage-verifier.mjs"
      - "backend/governance/pay54-pages-public-header-probe.mjs"
      - "backend/governance/pay54-static-site-secret-markers.mjs"
      - "backend/governance/pay54-external-script-source-review.mjs"
      - "backend/governance/pay54-static-site-candidate-inventory.mjs"
      - "backend/governance/pay54-public-site-manifest.mjs"
      - "backend/tests/account-batch13-static-site-link-audit.test.mjs"
      - "backend/tests/account-batch13-css-asset-link-audit.test.mjs"
      - "backend/tests/account-batch13-publication-readiness.test.mjs"
      - "backend/tests/account-batch13-site-content-integrity.test.mjs"
      - "backend/tests/account-batch13-site-stage-builder.test.mjs"
      - "backend/tests/account-batch13-site-stage-verifier.test.mjs"
      - "backend/tests/account-batch13-pages-public-header-probe.test.mjs"
      - "backend/tests/account-batch13-site-secret-markers.test.mjs"
      - "backend/tests/account-batch13-external-script-review.test.mjs"
      - "backend/tests/account-batch13-workflow-trigger.test.mjs"
      - ".github/workflows/pay54-batch13-static-link-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-batch13-static-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-publication-links:
    name: source-only-link-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_ENV: test
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout PR code without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Validate source syntax
        run: |
          node --check backend/governance/pay54-static-site-link-audit.mjs
          node --check backend/governance/pay54-css-asset-link-audit.mjs
          node --check backend/governance/pay54-publication-source-readiness.mjs
          node --check backend/governance/pay54-static-site-content-integrity.mjs
          node --check backend/governance/pay54-static-site-stage-builder.mjs
          node --check backend/governance/pay54-static-site-stage-verifier.mjs
          node --check backend/governance/pay54-pages-public-header-probe.mjs
          node --check backend/governance/pay54-static-site-secret-markers.mjs
          node --check backend/governance/pay54-external-script-source-review.mjs
          node --check backend/tests/account-batch13-static-site-link-audit.test.mjs
          node --check backend/tests/account-batch13-css-asset-link-audit.test.mjs
          node --check backend/tests/account-batch13-publication-readiness.test.mjs
          node --check backend/tests/account-batch13-site-content-integrity.test.mjs
          node --check backend/tests/account-batch13-site-stage-builder.test.mjs
          node --check backend/tests/account-batch13-site-stage-verifier.test.mjs
          node --check backend/tests/account-batch13-pages-public-header-probe.test.mjs
          node --check backend/tests/account-batch13-site-secret-markers.test.mjs
          node --check backend/tests/account-batch13-external-script-review.test.mjs
          node --check backend/tests/account-batch13-workflow-trigger.test.mjs
      - name: Execute adversarial Batch 13 regression
        run: node --test backend/tests/account-batch13-*.test.mjs
      - name: Check actual selected public source for high-confidence secret markers
        run: node backend/governance/pay54-static-site-secret-markers.mjs
      - name: Reject insecure external script transports without claiming SRI attestation
        run: |
          node --input-type=module -e 'import {auditPay54ExternalScripts} from "./backend/governance/pay54-external-script-source-review.mjs"; const report=auditPay54ExternalScripts(); console.log("External scripts:",report.externalScriptCount,"Manual-review findings:",report.findings.length); if(report.findings.some(f=>f.ruleId==="INSECURE_EXTERNAL_SCRIPT")) process.exit(1);'
      - name: Keep deployment and financial execution blocked
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          echo "Source-only audit; website publication and production release remain blocked."
