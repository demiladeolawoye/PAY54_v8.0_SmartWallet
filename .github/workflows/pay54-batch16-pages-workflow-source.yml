name: PAY54 Batch 16 Pages Workflow Source Boundary

on:
  pull_request:
    branches:
      - cto/batch15-publication-boundary-468-517
      - project-titan
    paths:
      - "backend/governance/pay54-pages-workflow-source-audit.mjs"
      - "backend/governance/pay54-dashboard-offline-preview.mjs"
      - "backend/governance/pay54-dashboard-preview-readiness.mjs"
      - "docs/engineering/pay54-dashboard-preview-acceptance.md"
      - "backend/tests/account-batch16-*.test.mjs"
      - ".github/workflows/pay54-batch16-pages-workflow-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-batch16-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: check-workflow-source-without-deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_ENV: test
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout with no persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Syntax checks
        run: |
          node --check backend/governance/pay54-pages-workflow-source-audit.mjs
          node --check backend/governance/pay54-dashboard-offline-preview.mjs
          node --check backend/governance/pay54-dashboard-preview-readiness.mjs
          node --check backend/tests/account-batch16-pages-workflow-source.test.mjs
          node --check backend/tests/account-batch16-dashboard-preview-acceptance.test.mjs
          node --check backend/tests/account-batch16-dashboard-offline-preview.test.mjs
          node --check backend/tests/account-batch16-dashboard-preview-readiness.test.mjs
      - name: Run offline source security tests
        run: node --test backend/tests/account-batch16-*.test.mjs
      - name: Check current dashboard snapshot against repository source without publishing
        run: node backend/governance/pay54-dashboard-preview-readiness.mjs
      - name: Verify deployment and real money are disabled
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          echo "No Pages deployment or financial operation performed."
