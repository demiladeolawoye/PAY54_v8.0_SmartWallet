name: PAY54 Dashboard Account Read Race Security

on:
  pull_request:
    branches:
      - project-titan
    paths:
      - "assets/js/dashboard/account-read-coordinator.mjs"
      - "assets/js/dashboard/wallet-balance-presenter.mjs"
      - "backend/src/authenticated-wallet-balance-read.mjs"
      - "backend/src/restricted-wallet-accounting-reader.mjs"
      - "backend/tests/restricted-wallet-accounting-reader.test.mjs"
      - "docs/architecture/PAY54-BATCH35-restricted-wallet-read-proof.md"
      - "backend/db/wallet-read-transaction-attestor.mjs"
      - "backend/tests/wallet-read-transaction-attestor.test.mjs"
      - "docs/architecture/PAY54-BATCH34-restricted-read-authority.md"
      - "backend/domain/wallet-reservation-reconciliation.mjs"
      - "backend/tests/wallet-reservation-reconciliation.test.mjs"
      - "docs/architecture/PAY54-BATCH33-wallet-reservation-reconciliation.md"
      - "backend/src/wallet-balance-http-handler.mjs"
      - "backend/tests/wallet-balance-http-handler.test.mjs"
      - "docs/architecture/PAY54-BATCH32-wallet-api-sql-proof.md"
      - "backend/tests/authenticated-wallet-balance-read.test.mjs"
      - "backend/tests/dashboard-wallet-balance-presenter.test.mjs"
      - "docs/architecture/PAY54-BATCH31-wallet-read-integration.md"
      - "assets/js/dashboard-core.js"
      - "backend/tests/dashboard-balance-integrity.test.mjs"
      - "docs/architecture/PAY54-BATCH30-dashboard-balance-integrity.md"
      - "backend/tests/dashboard-account-read-coordinator.test.mjs"
      - "docs/architecture/CR-DASHBOARD-01-account-read-coordination.md"
      - ".github/workflows/pay54-dashboard-account-read-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-read-coordination:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_FINANCIAL_EXECUTION: "false"
      PAY54_PAYTAG_RUNTIME: DISABLED
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Account-scoped dashboard read regression
        run: |
          set -euo pipefail
          node --check assets/js/dashboard/account-read-coordinator.mjs
          node --check assets/js/dashboard-core.js
          node --test backend/tests/dashboard-balance-integrity.test.mjs
          node --test backend/tests/dashboard-account-read-coordinator.test.mjs
          node --check backend/src/authenticated-wallet-balance-read.mjs
          node --check assets/js/dashboard/wallet-balance-presenter.mjs
          node --test backend/tests/authenticated-wallet-balance-read.test.mjs
          node --check backend/src/restricted-wallet-accounting-reader.mjs
          node --test backend/tests/restricted-wallet-accounting-reader.test.mjs
          node --check backend/db/wallet-read-transaction-attestor.mjs
          node --test backend/tests/wallet-read-transaction-attestor.test.mjs
          node --check backend/domain/wallet-reservation-reconciliation.mjs
          node --test backend/tests/wallet-reservation-reconciliation.test.mjs
          node --check backend/src/wallet-balance-http-handler.mjs
          node --test backend/tests/wallet-balance-http-handler.test.mjs
          node --test backend/tests/dashboard-wallet-balance-presenter.test.mjs
          node --test backend/tests/account-batch21-wallet-read-admission.test.mjs
      - name: Reject financial activation
        run: |
          test "$PAY54_FINANCIAL_EXECUTION" = false
          test "$PAY54_PAYTAG_RUNTIME" = DISABLED
          test "$TF_VAR_authorized_provisioning" = false
