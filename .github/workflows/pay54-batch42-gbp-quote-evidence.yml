name: PAY54 Batch42 GBP Quote Evidence (SOURCE ONLY)
on:
  pull_request:
    branches: [project-titan]
    paths:
      - "backend/governance/pay54-gbp-quote-evidence.mjs"
      - "backend/tests/pay54-gbp-quote-evidence.test.mjs"
      - "docs/engineering/PAY54-BATCH42-gbp-quote-evidence.md"
      - ".github/workflows/pay54-batch42-gbp-quote-evidence.yml"
permissions:
  contents: read
jobs:
  offline-evidence-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Offline tests only
        run: |
          node --check backend/governance/pay54-gbp-quote-evidence.mjs
          node --test backend/tests/pay54-gbp-quote-evidence.test.mjs
