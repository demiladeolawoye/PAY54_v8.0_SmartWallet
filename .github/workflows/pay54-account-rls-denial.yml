name: PAY54 Account RLS Denial

on:
  push:
    branches: [project-titan]
    paths:
      - "backend/db/migrations/013_account_rls_denial.sql"
      - "backend/db/tests/014_account_rls_denial.sql"
      - ".github/workflows/pay54-account-rls-denial.yml"
  pull_request:
    paths:
      - "backend/db/migrations/013_account_rls_denial.sql"
      - "backend/db/tests/014_account_rls_denial.sql"
      - ".github/workflows/pay54-account-rls-denial.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pay54-rls-denial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rls-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pay54_rls_ci
          POSTGRES_PASSWORD: pay54_disposable_rls_ci_2026
          POSTGRES_DB: pay54_rls_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pay54_rls_ci -d pay54_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: pay54_rls_ci
      PGPASSWORD: pay54_disposable_rls_ci_2026
      PGDATABASE: pay54_rls_test
      PGSSLMODE: disable
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations 001–013 only to ephemeral database
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/db/migrations/{001,002,003,004,005,006,007,008,009,010,011,012,013}_*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify RLS denies and old financial boundaries
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/db/tests/{014,013,012,011,010,009,008,007}_*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Preserve security gates
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
