name: PAY54 Batch46 Financial Writer Contract (OFFLINE)
on:
  pull_request:
    branches: [project-titan]
    paths:
      - "backend/governance/pay54-financial-writer-compatibility.mjs"
      - "backend/tests/pay54-financial-writer-compatibility.test.mjs"
      - "backend/db/tests/batch22/038_financial_writer_invoker_contract.sql"
      - "docs/engineering/PAY54-BATCH46-writer-compatibility-contract.md"
      - ".github/workflows/pay54-batch46-writer-contract.yml"
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Source-only compatibility contract tests
        run: |
          node --check backend/governance/pay54-financial-writer-compatibility.mjs
          node --test backend/tests/pay54-financial-writer-compatibility.test.mjs
