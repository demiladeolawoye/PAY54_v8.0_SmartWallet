name: PAY54 PayTag Restricted Backend Source Tests

on:
  pull_request:
    branches:
      - project-titan
    paths:
      - "backend/src/paytag-restricted-registration-preview.mjs"
      - "backend/tests/paytag-restricted-registration-preview.test.mjs"
      - "docs/architecture/CR-PAYTAG-01-p2b-b2b10-backend-runtime-admission.md"
      - ".github/workflows/pay54-paytag-backend-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-paytag-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restricted-backend-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_PAYTAG_RUNTIME: "DISABLED"
      PAY54_FINANCIAL_EXECUTION: "false"
      PAY54_STAGING_EXECUTION: "DISABLED"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout exact reviewed source without retaining credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Validate source syntax and adversarial registration tests
        run: |
          set -euo pipefail
          node --check backend/src/paytag-restricted-registration-preview.mjs
          node --check backend/tests/paytag-restricted-registration-preview.test.mjs
          node --test backend/tests/paytag-restricted-registration-preview.test.mjs
          node --test backend/tests/paytag-registration-admission.test.mjs
          node --test backend/tests/paytag-registration-request-binding.test.mjs
      - name: Assert no deployment privileges or financial activation
        run: |
          set -euo pipefail
          test "$PAY54_PAYTAG_RUNTIME" = "DISABLED"
          test "$PAY54_FINANCIAL_EXECUTION" = "false"
          test "$PAY54_STAGING_EXECUTION" = "DISABLED"
          test "$TF_VAR_authorized_provisioning" = "false"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { PAY54_PAYTAG_RESTRICTED_PREVIEW_POSTURE as p }
            from "./backend/src/paytag-restricted-registration-preview.mjs";
          assert.equal(p.httpRouteEnabled,false);
          assert.equal(p.liveDbConnectorProvisioned,false);
          assert.equal(p.persistentStagingEnabled,false);
          assert.equal(p.productionEnabled,false);
          assert.equal(p.financialExecutionEnabled,false);
          NODE
