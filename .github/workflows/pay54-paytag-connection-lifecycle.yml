name: PAY54 PayTag Cohesive Connection Lifecycle Source Tests

on:
  pull_request:
    branches:
      - project-titan
    paths:
      - "backend/db/paytag-disposable-connection-lifecycle.mjs"
      - "backend/tests/paytag-disposable-connection-lifecycle.test.mjs"
      - "docs/architecture/CR-PAYTAG-01-p2b-b2b15-delivery-package.md"
      - ".github/workflows/pay54-paytag-connection-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-paytag-connection-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_FINANCIAL_EXECUTION: "false"
      PAY54_PAYTAG_RUNTIME: DISABLED
      PAY54_DATABASE_PROVISIONING: DISABLED
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout exact PR source without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Test connection generation lifecycle and existing runtime deny gates
        run: |
          set -euo pipefail
          node --check backend/db/paytag-disposable-connection-lifecycle.mjs
          node --test backend/tests/paytag-disposable-connection-lifecycle.test.mjs
          node --test backend/tests/paytag-credential-identity-review.test.mjs
          node --test backend/tests/paytag-connection-custody-review.test.mjs
          node --test backend/tests/paytag-runtime-activation-gate.test.mjs
      - name: Confirm runtime is unavailable and provider provisioning blocked
        run: |
          set -euo pipefail
          test "$PAY54_FINANCIAL_EXECUTION" = false
          test "$PAY54_PAYTAG_RUNTIME" = DISABLED
          test "$PAY54_DATABASE_PROVISIONING" = DISABLED
          test "$TF_VAR_authorized_provisioning" = false
