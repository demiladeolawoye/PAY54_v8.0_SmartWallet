name: PAY54 Batch41 Cloud SQL Cost Admission (SOURCE ONLY)
on:
  pull_request:
    branches: [project-titan]
    paths:
      - "backend/governance/pay54-cloudsql-cost-assumptions.mjs"
      - "backend/tests/pay54-cloudsql-cost-assumptions.test.mjs"
      - "docs/engineering/PAY54-BATCH41-cloudsql-cost-admission.md"
      - ".github/workflows/pay54-batch41-cost-admission.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-price-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_CLOUD_AUTH: disabled
      PAY54_FINANCIAL_EXECUTION: "false"
      TF_VAR_authorized_provisioning: "false"
      PAY54_STAGING_RELEASE_APPROVED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify model is deterministic, conservative and source only
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/governance/pay54-cloudsql-cost-assumptions.mjs
          node --test backend/tests/pay54-cloudsql-cost-assumptions.test.mjs
          test "$PAY54_CLOUD_AUTH" = disabled
          test "$PAY54_FINANCIAL_EXECUTION" = false
          test "$TF_VAR_authorized_provisioning" = false
          test "$PAY54_STAGING_RELEASE_APPROVED" = false
