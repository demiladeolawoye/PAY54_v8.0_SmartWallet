name: PAY54 Wave8 Physical Canonical Money vs Revocation Gate (NO DEPLOY)
on:
  pull_request:
    branches:
      - cto/acceleration-wave7-canonical-writer-disposable-20261127
      - project-titan
    paths:
      - "backend/db/tests/batch61/*"
      - "backend/tests/pay54-wave8-*.test.mjs"
      - "docs/engineering/PAY54-ACCELERATION-WAVE8.md"
      - ".github/workflows/pay54-wave8-canonical-revocation.yml"
      - ".github/workflows/pay54-batch22-postgres-rls-integration.yml"
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Reject missing physical concurrency and cleanup controls
        run: |
          python3 -m py_compile backend/db/tests/batch61/canonical_posting_revocation_race.py
          node --test backend/tests/pay54-wave8-canonical-revocation.test.mjs
