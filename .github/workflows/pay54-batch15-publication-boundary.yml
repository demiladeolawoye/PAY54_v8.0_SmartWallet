name: PAY54 Batch 15 Publication Boundary Source Tests

on:
  pull_request:
    branches:
      - cto/batch14-release-evidence-418-467
      - project-titan
    paths:
      - "backend/governance/pay54-publication-tree-inspector.mjs"
      - "backend/governance/pay54-static-site-stage-builder.mjs"
      - "backend/governance/pay54-publication-candidate-attestation.mjs"
      - "docs/engineering/pay54-pages-artifact-p0-finding-20261116.md"
      - "backend/tests/account-batch15-*.test.mjs"
      - ".github/workflows/pay54-batch15-publication-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-batch15-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-boundary-source:
    name: offline-publication-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_ENV: test
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Static source syntax
        run: |
          node --check backend/governance/pay54-publication-tree-inspector.mjs
          node --check backend/governance/pay54-static-site-stage-builder.mjs
          node --check backend/governance/pay54-publication-candidate-attestation.mjs
          node --check backend/tests/account-batch15-publication-tree-inspector.test.mjs
          node --check backend/tests/account-batch15-stage-integration.test.mjs
          node --check backend/tests/account-batch15-candidate-attestation.test.mjs
          node --check backend/tests/account-batch15-pages-artifact-finding.test.mjs
      - name: Run Batch 15 source-only security tests
        run: node --test backend/tests/account-batch15-*.test.mjs
      - name: Assert deployment and money modes remain disabled
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          echo "No Pages or financial production changes were made."
