name: PAY54 Batch 10 Synthetic Role and Audit Source Tests
on:
  push:
    branches: [project-titan]
    paths:
      - "backend/db/tests/022_account_batch10_session_role_attestation.sql"
      - "backend/db/tests/023_account_batch10_guc_spoof_denial.sql"
      - "backend/db/tests/024_account_batch10_no_grants_rollback.sql"
      - "backend/domain/account-*.mjs"
      - "backend/security/account-*.mjs"
      - "backend/db/account-*.mjs"
      - "backend/tests/account-*.test.mjs"
      - ".github/workflows/pay54-account-batch10-source-integration.yml"
  pull_request:
    paths:
      - "backend/db/tests/022_account_batch10_session_role_attestation.sql"
      - "backend/db/tests/023_account_batch10_guc_spoof_denial.sql"
      - "backend/db/tests/024_account_batch10_no_grants_rollback.sql"
      - "backend/domain/account-*.mjs"
      - "backend/security/account-*.mjs"
      - "backend/db/account-*.mjs"
      - "backend/tests/account-*.test.mjs"
      - ".github/workflows/pay54-account-batch10-source-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pay54-batch10-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-sql-and-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pay54_batch10_ci
          POSTGRES_PASSWORD: pay54_disposable_batch10_ci_2026
          POSTGRES_DB: pay54_batch10_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pay54_batch10_ci -d pay54_batch10_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: pay54_batch10_ci
      PGPASSWORD: pay54_disposable_batch10_ci_2026
      PGDATABASE: pay54_batch10_test
      PGSSLMODE: disable
      TF_VAR_authorized_provisioning: "false"
      PAY54_REAL_MONEY_MODE: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply baseline migrations in disposable CI only
        shell: bash
        run: |
          set -euo pipefail
          for f in backend/db/migrations/{001,002,003,004,005,006,007,008,009,010,011,012,013}_*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Synthetic role switching, GUC denial and rollback
        shell: bash
        run: |
          set -euo pipefail
          for suite in 022 023 024; do
            for f in backend/db/tests/${suite}_*.sql; do
              psql -X -v ON_ERROR_STOP=1 -f "$f"
            done
          done
      - name: New Batch 10 and historical account source tests
        shell: bash
        run: |
          set -euo pipefail
          for f in backend/db/account-*.mjs backend/domain/account-*.mjs backend/security/account-*.mjs; do
            node --check "$f"
          done
          node --test backend/tests/account-*.test.mjs backend/tests/trusted-account-principal.test.mjs
      - name: Verify nonactivation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$TF_VAR_authorized_provisioning" = "false"
          test "$PAY54_REAL_MONEY_MODE" = "false"
          echo "Synthetic PostgreSQL only. No live tenant credentials or customer table grants."
