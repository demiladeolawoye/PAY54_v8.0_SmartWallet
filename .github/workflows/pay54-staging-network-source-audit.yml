name: PAY54 STG-05 Network Source Audit

on:
  push:
    branches:
      - project-titan
    paths:
      - "backend/governance/staging-network-audit.mjs"
      - "backend/tests/staging-network-audit.test.mjs"
      - "terraform/**"
      - "infrastructure/**"
      - "infra/**"
      - ".github/workflows/pay54-staging-network-source-audit.yml"
  pull_request:
    paths:
      - "backend/governance/staging-network-audit.mjs"
      - "backend/tests/staging-network-audit.test.mjs"
      - "terraform/**"
      - "infrastructure/**"
      - "infra/**"
      - ".github/workflows/pay54-staging-network-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-stg05-network-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-network-source-audit:
    name: Read-only STG-05 evidence preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_FINANCIAL_EXECUTION: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run network source regression tests
        run: node --test backend/tests/staging-network-audit.test.mjs
      - name: Inventory staging Terraform declarations only
        run: node backend/governance/staging-network-audit.mjs
      - name: Confirm release and execution remain blocked
        shell: bash
        run: |
          set -euo pipefail
          test "$PAY54_FINANCIAL_EXECUTION" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          echo "STG-05 is NOT_VERIFIED. No cloud operation or financial execution performed."
