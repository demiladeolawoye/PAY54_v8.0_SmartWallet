name: PAY54 Batch55 Physical Financial Race Source Admission
on:
  pull_request:
    branches:
      - cto/batch54-transaction-bound-synthetic-ledger-20261125
      - project-titan
    paths:
      - "backend/db/tests/batch55/*"
      - "backend/tests/batch55-physical-financial-races.test.mjs"
      - "docs/engineering/PAY54-BATCH55-physical-ledger-revocation-races.md"
      - ".github/workflows/pay54-batch55-source.yml"
      - ".github/workflows/pay54-batch22-postgres-rls-integration.yml"
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify physical race prerequisites and disabled financial execution
        run: |
          bash -n backend/db/tests/batch55/002_physical_financial_revocation_races.sh
          node --check backend/tests/batch55-physical-financial-races.test.mjs
          node --test backend/tests/batch55-physical-financial-races.test.mjs
