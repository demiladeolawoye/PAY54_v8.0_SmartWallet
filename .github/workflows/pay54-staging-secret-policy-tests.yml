
name: PAY54 Staging Secret Manager Policy Tests

on:
  push:
    branches:
      - project-titan
    paths:
      - "backend/security/staging-secret-policy.mjs"
      - "backend/tests/staging-secret-policy.test.mjs"
      - "infrastructure/staging/main.tf"
      - ".github/workflows/pay54-staging-secret-policy-tests.yml"

  pull_request:
    paths:
      - "backend/security/staging-secret-policy.mjs"
      - "backend/tests/staging-secret-policy.test.mjs"
      - "infrastructure/staging/main.tf"
      - ".github/workflows/pay54-staging-secret-policy-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-staging-secret-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-policy:
    name: STG-03 Offline Secret Security Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PAY54_STAGING_CLOUD_AUTH: "false"
      TF_VAR_authorized_provisioning: "false"

    steps:
      - name: Checkout unprivileged PAY54 source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate STG-03 secret policy and staging boundary
        run: node --test backend/tests/staging-secret-policy.test.mjs

      - name: Report non-deploying security checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$PAY54_STAGING_CLOUD_AUTH" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          {
            echo "## PAY54 STG-03 — Secret Manager Policy"
            echo ""
            echo "**PASS — OFFLINE POLICY VALIDATION ONLY**"
            echo ""
            echo "- No Secret Manager API enabled by this workflow"
            echo "- No credentials exchanged or secrets created"
            echo "- No Terraform provisioning or container deployment"
            echo "- No financial execution"
            echo "- Independent approval and live cloud evidence still required"
          } >> "$GITHUB_STEP_SUMMARY"
