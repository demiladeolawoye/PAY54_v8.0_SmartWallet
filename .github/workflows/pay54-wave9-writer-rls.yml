name: PAY54 Wave9 Financial Writer RLS Migration & Rollback (NO DEPLOY)
on:
  pull_request:
    branches:
      - cto/acceleration-wave8-canonical-revocation-race-20261127
      - project-titan
    paths:
      - "backend/db/release/writer-rls-v1-*.sql"
      - "backend/db/tests/batch62/*.sql"
      - "backend/tests/pay54-wave9-*.test.mjs"
      - "docs/engineering/PAY54-ACCELERATION-WAVE9.md"
      - ".github/workflows/pay54-wave9-writer-rls.yml"
      - ".github/workflows/pay54-batch22-postgres-rls-integration.yml"
permissions:
  contents: read
jobs:
  fail-closed-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check rollback ordering, grant absence and deny-only policies
        run: |
          node --check backend/tests/pay54-wave9-rls-migration.test.mjs
          node --test backend/tests/pay54-wave9-rls-migration.test.mjs
