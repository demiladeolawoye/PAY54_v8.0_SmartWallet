
name: PAY54 STG-05 Egress Destination Inventory

on:
  push:
    branches:
      - project-titan
    paths:
      - "backend/governance/staging-egress-destinations.json"
      - "backend/governance/staging-egress-destinations.mjs"
      - "backend/tests/staging-egress-destinations.test.mjs"
      - ".github/workflows/pay54-staging-egress-destinations.yml"

  pull_request:
    paths:
      - "backend/governance/staging-egress-destinations.json"
      - "backend/governance/staging-egress-destinations.mjs"
      - "backend/tests/staging-egress-destinations.test.mjs"
      - ".github/workflows/pay54-staging-egress-destinations.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-stg05-destinations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-destination-inventory:
    name: Read-only destination inventory contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PAY54_FINANCIAL_EXECUTION: "false"
      TF_VAR_authorized_provisioning: "false"

    steps:
      - name: Checkout unprivileged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run offline regression tests
        run: node --test backend/tests/staging-egress-destinations.test.mjs

      - name: Validate proposed destinations and release block
        run: node backend/governance/staging-egress-destinations.mjs

      - name: Confirm all activation remains disabled
        shell: bash
        run: |
          set -euo pipefail
          test "$PAY54_FINANCIAL_EXECUTION" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          echo "Inventory audit only. STG-05 unverified; release BLOCKED."
