name: PAY54 Account Cross-Tenant Denial

on:
  push:
    branches: [project-titan]
    paths:
      - "backend/db/tests/015_account_rls_cross_tenant.sql"
      - ".github/workflows/pay54-account-cross-tenant-db-tests.yml"
  pull_request:
    paths:
      - "backend/db/tests/015_account_rls_cross_tenant.sql"
      - ".github/workflows/pay54-account-cross-tenant-db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pay54-account-tenant-sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tenant-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pay54_tenant_ci
          POSTGRES_PASSWORD: pay54_disposable_tenant_ci_2026
          POSTGRES_DB: pay54_tenant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pay54_tenant_ci -d pay54_tenant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: pay54_tenant_ci
      PGPASSWORD: pay54_disposable_tenant_ci_2026
      PGDATABASE: pay54_tenant_test
      PGSSLMODE: disable
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations only in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/db/migrations/{001,002,003,004,005,006,007,008,009,010,011,012,013}_*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Cross-tenant deny and rollback-only privilege simulation
        run: psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/015_account_rls_cross_tenant.sql
      - name: Confirm inherited access remains blocked
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/014_account_rls_denial.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/db/tests/013_account_privilege_matrix.sql
      - name: No financial or cloud execution
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
