name: PAY54 Batch37 Wallet Staging Operational Gate (SOURCE ONLY)

on:
  pull_request:
    branches:
      - project-titan
    paths:
      - "backend/governance/pay54-wallet-staging-operational-evidence.mjs"
      - "backend/tests/pay54-wallet-staging-operational-evidence.test.mjs"
      - "backend/tests/wallet-staging-no-customer-balance.test.mjs"
      - "docs/architecture/PAY54-BATCH37-operational-wallet-staging.md"
      - ".github/workflows/pay54-batch37-staging-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-source-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_FINANCIAL_EXECUTION: "false"
      TF_VAR_authorized_provisioning: "false"
      PAY54_CLOUD_AUTH: disabled
      PAY54_PUBLICATION: DISABLED
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Source release denial and browser no-exposure tests
        run: |
          set -euo pipefail
          node --check backend/governance/pay54-wallet-staging-operational-evidence.mjs
          node --test backend/tests/pay54-wallet-staging-operational-evidence.test.mjs
          node --test backend/tests/wallet-staging-no-customer-balance.test.mjs
          node --test backend/tests/dashboard-wallet-balance-presenter.test.mjs
      - name: Enforce no cloud, money or public release
        run: |
          set -euo pipefail
          test "$PAY54_FINANCIAL_EXECUTION" = false
          test "$TF_VAR_authorized_provisioning" = false
          test "$PAY54_CLOUD_AUTH" = disabled
          test "$PAY54_PUBLICATION" = DISABLED
          bash -n backend/db/tests/batch22/032_wallet_revocation_snapshot_race.sh
