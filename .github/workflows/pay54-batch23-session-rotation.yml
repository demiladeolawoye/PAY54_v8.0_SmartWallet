name: PAY54 Batch 23 Session Rotation (Disposable PostgreSQL)

on:
  pull_request:
    branches:
      - cto/batch22-postgres-trusted-account-818-867
      - project-titan
    paths:
      - "backend/db/migrations/018_account_session_rotation.sql"
      - "backend/db/tests/batch23/**"
      - "backend/src/postgres-session-rotation.mjs"
      - "backend/tests/account-batch23-*.test.mjs"
      - ".github/workflows/pay54-batch23-session-rotation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-batch23-rotation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-rotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
        env:
          POSTGRES_DB: pay54_batch23_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pay54-batch23-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pay54_batch23_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact review SHA without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Apply canonical migration chain followed by approved source-only extension
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER"
          migrations=(
            001_financial_ledger.sql
            002_ledger_integrity_hardening.sql
            003_wallet_reservation.sql
            004_reservation_lifecycle.sql
            005_operation_state_integrity.sql
            006_database_role_isolation.sql
            007_direct_ledger_access_boundary.sql
            008_account_context_foundation.sql
            009_personal_wallet_binding.sql
            010_wallet_binding_lifecycle_guard.sql
            011_wallet_eligibility_view.sql
            012_account_read_role_baseline.sql
            013_account_rls_denial.sql
            014_auth_sessions.sql
            015_account_context_audit.sql
            016_session_account_integrity.sql
            017_account_directory_read_role.sql
            018_account_session_rotation.sql
          )
          for name in "${migrations[@]}"; do
            file="backend/db/migrations/$name"
            test -s "$file"
            docker exec -i "$PG_CONTAINER" psql -X -U postgres -d pay54_batch23_ci \
              -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Seed only Batch 22 isolated synthetic identities
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -X -U postgres -d pay54_batch23_ci \
            -v ON_ERROR_STOP=1 < backend/db/tests/batch22/001_rls_tenant_isolation.sql
      - name: Execute Batch 23 SQL session rotation and adversarial tests
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/db/tests/batch23/*.sql; do
            test -s "$file"
            docker exec -i "$PG_CONTAINER" psql -X -U postgres -d pay54_batch23_ci \
              -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Verify replay contention with two concurrent PostgreSQL clients
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          bash backend/db/tests/batch23/003_concurrent_rotation.sh
      - name: Retain denied backend account and payment endpoints
        shell: bash
        run: |
          set -euo pipefail
          node --test backend/tests/account-batch21-http-no-switch.test.mjs
          node --test backend/tests/account-batch21-no-money-side-effects.test.mjs
      - name: Execute Batch 23 Node security tests
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/src/postgres-session-rotation.mjs backend/tests/account-batch23-*.test.mjs; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
          shopt -s nullglob
          tests=(backend/tests/account-batch23-*.test.mjs)
          if (( ${#tests[@]} )); then node --test "${tests[@]}"; fi
          test "${PAY54_REAL_MONEY_MODE:-false}" = "false"
          test "${TF_VAR_authorized_provisioning:-false}" = "false"
