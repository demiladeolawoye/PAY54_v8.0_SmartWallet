name: PAY54 Batch 20 Publication Boundary Regression

on:
  pull_request:
    branches:
      - cto/batch19-public-preview-safety-668-717
      - project-titan
    paths:
      - "backend/governance/pay54-batch20-*.mjs"
      - "backend/tests/account-batch20-*.test.mjs"
      - "backend/governance/pay54-static-site-link-audit.mjs"
      - "backend/governance/pay54-firstparty-html-dependency-audit.mjs"
      - ".github/workflows/pay54-batch20-publication-boundary.yml"
      - "docs/engineering/pay54-batch20-*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-batch20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PAY54_ENV: test
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout exact review SHA without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Syntax-check canonical publication source and complete new modules
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/governance/pay54-static-site-link-audit.mjs
          node --check backend/governance/pay54-firstparty-html-dependency-audit.mjs
          for file in backend/governance/pay54-batch20-*.mjs backend/tests/account-batch20-*.test.mjs; do
            if test -f "$file"; then node --check "$file"; fi
          done
      - name: Run newly added tests and retained baseline security suites
        run: |
          node --test backend/tests/account-batch20-*.test.mjs
          node --test backend/tests/account-batch19-html-attribute-boundary.test.mjs
          node --test backend/tests/account-batch18-html-dependency-audit.test.mjs
      - name: Create isolated PAY54 account selector visual fixture
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          node --check backend/governance/pay54-balance-visual-fixture.mjs
          node backend/governance/pay54-balance-visual-fixture.mjs
          test -s .pay54-balance-visual-fixture.html
      - name: Render desktop and mobile from isolated Chromium with no live backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pay54-account-visual"
          fixture="file://$GITHUB_WORKSPACE/.pay54-balance-visual-fixture.html"
          for target in desktop mobile; do
            if test "$target" = desktop; then size="1440,900"; else size="390,844"; fi
            profile="$RUNNER_TEMP/pay54-account-visual/chrome-$target"
            mkdir -p "$profile"
            google-chrome --headless --no-sandbox --disable-gpu --no-first-run \
              --disable-extensions --disable-background-networking --disable-sync \
              --no-proxy-server --host-resolver-rules="MAP * 0.0.0.0, EXCLUDE localhost" \
              --user-data-dir="$profile" --window-size="$size" \
              --virtual-time-budget=4000 \
              --screenshot="$RUNNER_TEMP/pay54-account-visual/$target.png" \
              "$fixture" >/dev/null 2>&1
            google-chrome --headless --no-sandbox --disable-gpu --no-first-run \
              --disable-extensions --disable-background-networking --disable-sync \
              --no-proxy-server --host-resolver-rules="MAP * 0.0.0.0, EXCLUDE localhost" \
              --user-data-dir="$profile" --virtual-time-budget=4000 \
              --dump-dom "$fixture" > "$RUNNER_TEMP/pay54-account-visual/$target.html" 2>/dev/null
          done
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            for(const size of ["desktop","mobile"]){
              const html=readFileSync(process.env.RUNNER_TEMP+"/pay54-account-visual/"+size+".html","utf8");
              for(const required of ["p54-blueprint","p54b-account-context","Personal account","Business","Unavailable"]){
                if(!html.includes(required))throw new Error("PAY54_ACCOUNT_VISUAL_MOUNT_MISSING_"+size+"_"+required);
              }
              if(/<html[^>]*class="[^"]*p54b-boot-pending/i.test(html)){
                throw new Error("PAY54_VISUAL_FIXTURE_OLD_DASHBOARD_HIDDEN_"+size);
              }
            }
          '
          rm -rf "$RUNNER_TEMP/pay54-account-visual/chrome-desktop" \
            "$RUNNER_TEMP/pay54-account-visual/chrome-mobile"
          rm -f "$RUNNER_TEMP/pay54-account-visual/"*.html .pay54-balance-visual-fixture.html .pay54-qa-auth-session.js
      - name: Upload screenshot-only visual QA (never Pages)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pay54-batch20-account-selector-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pay54-account-visual/*.png
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - name: Enforce no cloud/financial permissions
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          echo "Source checks only: no Pages publication, provisioning, account or card funding."
