name: PAY54 Batch 11 Publication Governance Source Tests

on:
  push:
    branches: [project-titan]
    paths:
      - "backend/governance/pay54-*.mjs"
      - "backend/tests/account-batch11-*.test.mjs"
      - ".github/workflows/pay54-batch11-publication-governance.yml"
  pull_request:
    paths:
      - "backend/governance/pay54-*.mjs"
      - "backend/tests/account-batch11-*.test.mjs"
      - ".github/workflows/pay54-batch11-publication-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-batch11-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-publication-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PAY54_ENV: test
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax preflight for all publication policy and Batch 11 test source
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/governance/pay54-*.mjs backend/tests/account-batch11-*.test.mjs; do
            node --check "$file"
          done
      - name: Offline publication and release evidence regression
        shell: bash
        run: |
          set -euo pipefail
          node --test backend/tests/account-batch11-*.test.mjs
      - name: Inspect all checked-out GitHub Actions workflows (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node backend/governance/pay54-workflow-inventory-cli.mjs > "$RUNNER_TEMP/pay54-workflow-inventory.json"
          node --input-type=module -e '
            import {readFileSync,appendFileSync} from "node:fs";
            const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/pay54-workflow-inventory.json","utf8"));
            if(!report.inventoryReviewedFromDisk||report.workflowCount<1||report.productionRelease!=="BLOCKED"||report.financialExecutionEnabled!==false){
              throw new Error("WORKFLOW_SOURCE_AUDIT_INVALID");
            }
            const summary=[
              "## PAY54 GitHub Actions source inventory",
              "",
              "Source inspection only — no GitHub settings, deployed environments or upstream signatures verified.",
              "",
              "| Source observation | Count |",
              "| --- | ---: |",
              "| Workflow files inspected | "+report.workflowCount+" |",
              "| Files needing manual trust review | "+report.highRiskWorkflowCount+" |",
              "| Mutable external Action references | "+report.mutableExternalActionCount+" |",
              "",
              "**Staging and production releases: BLOCKED.**"
            ].join("\n")+"\n";
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          '
      - name: Prohibit new publication or real-money activation
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          echo "Test-only. No GitHub Pages deployment, cloud provisioning or financial execution."
