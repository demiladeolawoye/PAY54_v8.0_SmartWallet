name: PAY54 Batch 22 PostgreSQL Account Security Source

on:
  pull_request:
    branches:
      - cto/batch21-account-context-768-817
      - project-titan
    paths:
      - "backend/db/migrations/0*.sql"
      - "backend/governance/pay54-batch22-migration-inventory.mjs"
      - "backend/src/postgres-*.mjs"
      - "backend/tests/account-batch22-*.test.mjs"
      - "docs/engineering/pay54-batch22-*.md"
      - ".github/workflows/pay54-batch22-postgres-account.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-batch22-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PAY54_ENV: test
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout exact review SHA with no retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Run complete Batch 22 SQL-adapter syntax checks
        run: |
          set -euo pipefail
          for file in backend/src/postgres-*.mjs backend/tests/account-batch22-*.test.mjs backend/governance/pay54-batch22-migration-inventory.mjs; do
            node --check "$file"
          done
      - name: Run Batch 22 PostgreSQL security unit and failure-path tests
        run: |
          set -euo pipefail
          node --test backend/tests/account-batch22-*.test.mjs
      - name: Verify PayTag P2A canonical namespace and deny-by-default source
        run: |
          set -euo pipefail
          node --check backend/tests/paytag-p2-schema-contract.test.mjs
          node --test backend/tests/paytag-p2-schema-contract.test.mjs
      - name: Retain Batch 21 account boundary and HTTP-denial regression
        run: |
          set -euo pipefail
          node --test backend/tests/account-batch21-*.test.mjs
          node --test backend/tests/account-batch20-context-selection.test.mjs
          node --test backend/tests/account-batch20-context-rebind.test.mjs
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          echo "Batch 22 source-only; no PostgreSQL instance or real money provisioned"
