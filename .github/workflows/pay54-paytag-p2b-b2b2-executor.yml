name: PAY54 PayTag P2B-B2B2 Restricted Registration Adapter Source Gate
on:
  pull_request:
    branches:
      - project-titan
    paths:
      - "backend/src/postgres-paytag-registration-executor.mjs"
      - "backend/tests/postgres-paytag-registration-executor.test.mjs"
      - "docs/architecture/CR-PAYTAG-01-p2b-b2b2-executor-gates.md"
      - ".github/workflows/pay54-paytag-p2b-b2b2-executor.yml"
permissions:
  contents: read
jobs:
  source-registration-executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: |
          set -euo pipefail
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          node --check backend/src/postgres-paytag-registration-executor.mjs
          node --test backend/tests/postgres-paytag-registration-executor.test.mjs
