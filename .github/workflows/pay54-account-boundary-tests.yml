name: PAY54 Account Boundary Tests

on:
  push:
    branches:
      - project-titan
    paths:
      - "backend/domain/account-*.mjs"
      - "backend/domain/trusted-account-principal.mjs"
      - "backend/http/account-context-handler.mjs"
      - "backend/tests/account-*.test.mjs"
      - "backend/tests/trusted-account-principal.test.mjs"
      - "assets/js/dashboard/account-switch-selection.mjs"
      - ".github/workflows/pay54-account-boundary-tests.yml"
  pull_request:
    paths:
      - "backend/domain/account-*.mjs"
      - "backend/domain/trusted-account-principal.mjs"
      - "backend/http/account-context-handler.mjs"
      - "backend/tests/account-*.test.mjs"
      - "backend/tests/trusted-account-principal.test.mjs"
      - "assets/js/dashboard/account-switch-selection.mjs"
      - ".github/workflows/pay54-account-boundary-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-account-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-security:
    name: Account Authorization and Isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate account modules and handler syntax
        run: |
          for file in backend/domain/account-*.mjs backend/domain/trusted-account-principal.mjs backend/http/account-context-handler.mjs assets/js/dashboard/account-switch-selection.mjs; do
            node --check "$file"
          done
      - name: Execute account authorization and negative tests
        run: |
          node --test backend/tests/account-*.test.mjs backend/tests/trusted-account-principal.test.mjs
      - name: Confirm no financial or cloud execution
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
