name: PAY54 PayTag Source Contract and Privacy Tests

on:
  pull_request:
    branches:
      - project-titan
    paths:
      - "backend/domain/paytag-identity-contract.mjs"
      - "backend/tests/paytag-identity-contract.test.mjs"
      - "docs/architecture/ADR-CR-PAYTAG-01-universal-payment-identity.md"
      - ".github/workflows/pay54-paytag-source-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-paytag-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paytag-contract:
    name: validate-source-only-paytag-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_ENV: test
      PAY54_REAL_MONEY_MODE: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Syntax validation
        run: |
          node --check backend/domain/paytag-identity-contract.mjs
          node --check backend/tests/paytag-identity-contract.test.mjs
      - name: Run adversarial PayTag identity tests
        run: node --test backend/tests/paytag-identity-contract.test.mjs
      - name: Prove PayTag contracts have no activation authority
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          node --input-type=module -e '
            import {PAY54_PAYTAG_CONTRACT} from "./backend/domain/paytag-identity-contract.mjs";
            if(PAY54_PAYTAG_CONTRACT.financialExecutionEnabled !== false ||
               PAY54_PAYTAG_CONTRACT.tagRegistrationEnabled !== false ||
               PAY54_PAYTAG_CONTRACT.recipientResolutionEnabled !== false ||
               PAY54_PAYTAG_CONTRACT.productionRelease !== "BLOCKED") process.exit(1);
          '
