name: PAY54 Batch 09 Account Actor and RLS Integration
on:
  push:
    branches: [project-titan]
    paths:
      - "backend/db/tests/019_account_role_acl_proof.sql"
      - "backend/db/tests/020_account_role_acl_adversarial.sql"
      - "backend/db/tests/021_account_role_acl_rollback.sql"
      - "backend/db/account-*.mjs"
      - "backend/domain/account-*.mjs"
      - "backend/http/account-*.mjs"
      - "backend/security/account-*.mjs"
      - "backend/governance/account-*.mjs"
      - "backend/tests/account-*.test.mjs"
      - ".github/workflows/pay54-account-batch09-integration.yml"
  pull_request:
    paths:
      - "backend/db/tests/019_account_role_acl_proof.sql"
      - "backend/db/tests/020_account_role_acl_adversarial.sql"
      - "backend/db/tests/021_account_role_acl_rollback.sql"
      - "backend/db/account-*.mjs"
      - "backend/domain/account-*.mjs"
      - "backend/http/account-*.mjs"
      - "backend/security/account-*.mjs"
      - "backend/governance/account-*.mjs"
      - "backend/tests/account-*.test.mjs"
      - ".github/workflows/pay54-account-batch09-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pay54-batch09-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-only-actor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pay54_batch09_ci
          POSTGRES_PASSWORD: pay54_disposable_batch09_ci_2026
          POSTGRES_DB: pay54_batch09_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pay54_batch09_ci -d pay54_batch09_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: pay54_batch09_ci
      PGPASSWORD: pay54_disposable_batch09_ci_2026
      PGDATABASE: pay54_batch09_test
      PGSSLMODE: disable
      TF_VAR_authorized_provisioning: "false"
      PAY54_REAL_MONEY_MODE: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare ephemeral PAY54 database 001–013
        shell: bash
        run: |
          set -euo pipefail
          for f in backend/db/migrations/{001,002,003,004,005,006,007,008,009,010,011,012,013}_*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Cross-tenant role ACL proofs and historical money/access guards
        shell: bash
        run: |
          set -euo pipefail
          for suite in 019 020 021 018 017 016 015 014 013 012 011 010 009 008 007; do
            for f in backend/db/tests/${suite}_*.sql; do
              psql -X -v ON_ERROR_STOP=1 -f "$f"
            done
          done
      - name: Source governance and role metadata invariants
        run: |
          node backend/governance/account-rls-audit.mjs
          node backend/governance/account-auth-security.mjs
          node backend/governance/account-source-security.mjs
          node backend/governance/account-batch07-safety.mjs
          node backend/governance/account-db-identity-safety.mjs
          node backend/governance/account-batch09-source-audit.mjs
      - name: Node account boundary syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          for f in backend/db/account-*.mjs backend/domain/account-*.mjs backend/http/account-*.mjs backend/security/account-*.mjs backend/governance/account-*.mjs; do
            node --check "$f"
          done
          node --test backend/tests/account-*.test.mjs backend/tests/trusted-account-principal.test.mjs
      - name: Confirm no cloud, production database or money execution
        run: |
          test "$PAY54_REAL_MONEY_MODE" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          echo "No deployment, no live DB credential, no customer grant and no financial execution."
