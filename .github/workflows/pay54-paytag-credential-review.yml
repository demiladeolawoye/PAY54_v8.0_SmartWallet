name: PAY54 PayTag Credential Identity Source Review

on:
  pull_request:
    branches:
      - project-titan
    paths:
      - "backend/governance/paytag-credential-identity-review.mjs"
      - "backend/tests/paytag-credential-identity-review.test.mjs"
      - "docs/architecture/CR-PAYTAG-01-p2b-b2b11-credential-identity.md"
      - ".github/workflows/pay54-paytag-credential-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay54-paytag-credential-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-identity-source:
    name: PAY54 credential identity no-activation evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAY54_PAYTAG_RUNTIME: "DISABLED"
      PAY54_PAYTAG_CREDENTIAL_PROVISIONING: "DISABLED"
      PAY54_PAYTAG_MIGRATION_EXECUTION: "DISABLED"
      PAY54_FINANCIAL_EXECUTION: "false"
      TF_VAR_authorized_provisioning: "false"
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure pinned Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify identity-review source and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/governance/paytag-credential-identity-review.mjs
          node --check backend/tests/paytag-credential-identity-review.test.mjs
          node --test backend/tests/paytag-credential-identity-review.test.mjs
          node --test backend/tests/paytag-runtime-activation-gate.test.mjs
      - name: Reject credential and financial deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test "$PAY54_PAYTAG_RUNTIME" = "DISABLED"
          test "$PAY54_PAYTAG_CREDENTIAL_PROVISIONING" = "DISABLED"
          test "$PAY54_PAYTAG_MIGRATION_EXECUTION" = "DISABLED"
          test "$PAY54_FINANCIAL_EXECUTION" = "false"
          test "$TF_VAR_authorized_provisioning" = "false"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {PAY54_PAYTAG_IDENTITY_REVIEW_POSTURE as p}
            from "./backend/governance/paytag-credential-identity-review.mjs";
          assert.equal(p.credentialAccessEnabled,false);
          assert.equal(p.roleAssumptionEnabled,false);
          assert.equal(p.stagingProvisioningEnabled,false);
          assert.equal(p.productionProvisioningEnabled,false);
          assert.equal(p.financialExecutionEnabled,false);
          NODE
